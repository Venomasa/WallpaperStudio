<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slideshow Config</title>
<style>
:root {
  --bg-primary: #0f0f12;
  --bg-secondary: #16161a;
  --bg-tertiary: #1e1e24;
  --border: #2a2a30;
  --border-hover: #3a3a40;
  --text-primary: #ffffff;
  --text-secondary: #a0a0a0;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.2s ease;
}

* { box-sizing: border-box; }

body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  margin: 0;
  padding: 30px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
background: var(--bg-secondary);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 40px;
width: 100%;
max-width: 450px;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

h1 {
margin: 0 0 8px;
font-size: 24px;
font-weight: 700;
background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

h1 {
  margin: 0 0 8px;
  font-size: 22px;
  font-weight: 600;
}

p {
  margin: 0 0 24px;
  color: var(--text-secondary);
  font-size: 14px;
}

.label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}

.input-group {
margin-bottom: 28px;
}

.input-wrapper {
display: flex;
align-items: center;
gap: 12px;
background: var(--bg-tertiary);
padding: 8px 12px;
border-radius: var(--radius-sm);
border: 1px solid var(--border);
}

.input-wrapper:focus-within {
border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

input[type="number"] {
width: 100%;
background: transparent;
border: none;
color: var(--text-primary);
font-size: 18px;
font-weight: 600;
transition: var(--transition);
}

input[type="number"]:focus {
outline: none;
}

.suffix {
color: var(--text-secondary);
font-size: 13px;
white-space: nowrap;
}

.actions {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-top: 32px;
padding-top: 24px;
border-top: 1px solid var(--border);
}

button {
padding: 12px 20px;
font-size: 14px;
font-weight: 600;
transition: all 0.2s ease;
}

button {
background: var(--bg-tertiary);
color: var(--text-primary);
border: 1px solid var(--border);
border-radius: var(--radius-sm);
cursor: pointer;
transition: all 0.2s ease;
}

button:hover {
  background: var(--border-hover);
  border-color: var(--border-hover);
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

button.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

button.danger {
  background: transparent;
  border-color: #ef4444;
  color: #ef4444;
}

button.danger:hover {
background: #ef4444;
color: white;
}

/* Custom scrollbar */
::-webkit-scrollbar {
width: 8px;
}

::-webkit-scrollbar-track {
background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
background: var(--border-hover);
border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
background: var(--text-secondary);
}
</style>
</head>
<body>
<div class="container">
<h1>Slideshow Settings</h1>
<p>Configure your wallpaper slideshow preferences</p>

<div class="input-group">
<label class="label" for="interval">Change wallpaper every</label>
<div class="input-wrapper">
<input id="interval" type="number" min="5" value="30" />
<span class="suffix">seconds</span>
</div>
</div>

<div class="input-group">
<label class="label" for="transition">Transition Effect</label>
<div class="input-wrapper" style="padding: 0; background: transparent; border: none;">
<select id="transition" style="width: 100%; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; cursor: pointer;">
<option value="fade">Fade</option>
<option value="slide">Slide</option>
<option value="zoom">Zoom</option>
<option value="none">None</option>
</select>
</div>
</div>

<div class="actions">
<button class="primary" id="apply-slideshow">Start Slideshow</button>
<button class="danger" id="stop-slideshow-modal">Stop</button>
<button id="close-slideshow-modal" style="grid-column: span 2;">Close</button>
</div>
</div>

<script>
// Load saved settings
const savedInterval = localStorage.getItem('slideshowInterval');
const savedTransition = localStorage.getItem('slideshowTransition');

if (savedInterval) {
document.getElementById('interval').value = savedInterval;
}
if (savedTransition) {
document.getElementById('transition').value = savedTransition;
}

document.getElementById('apply-slideshow').addEventListener('click', () => {
const interval = parseInt(document.getElementById('interval').value, 10) || 30;
const transition = document.getElementById('transition').value || 'fade';

// Save settings
localStorage.setItem('slideshowInterval', interval);
localStorage.setItem('slideshowTransition', transition);

window.slideshow.start(interval * 1000, transition);
window.close();
});

document.getElementById('stop-slideshow-modal').addEventListener('click', () => {
window.slideshow.stop();
window.close();
});

document.getElementById('close-slideshow-modal').addEventListener('click', () => window.close());
</script>
</body>
</html>
